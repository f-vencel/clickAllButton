<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
</head>
<body>
  <button  class="button catch fixed" tabindex="-1">Catch me</button>
  <div class="score">
    <div class="load"></div>
    <div class="points"></div>
  </div>
  <div class="settings">
    <input id="numOfBtns" inputmode="numeric" type="number" min="0" max="50" value="8" /><label for="numOfBtns">numOfBtns</label>
    <input id="minTime" inputmode="numeric" type="number" min="0" max="20" value="4" /><label for="minTime">minTime</label>
    <input id="maxTime" inputmode="numeric" type="number" min="0" max="100" value="10" /><label for="maxTime">maxTime</label>
    <input id="includeRand" type="checkbox" min="0" /><label for="maxTime">includeRand</label>
  </div>
  <div class="field"></div>
  <div class="winBefore"></div>
  <div class="win">
    <h1>You Won</h1>
    <h3>🎉🎉🎉</h3>
  </div>
</body>
</html>
